name: Scrape Moneycontrol

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Pages per run'
        required: false
        default: '50'
        type: choice
        options:
          - '10'
          - '25'
          - '50'
          - '100'
          - '200'
      max_depth:
        description: 'Maximum link depth'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      runs_left:
        description: 'Further runs to chain if URLs pending'
        required: false
        default: '5'
        type: choice
        options:
          - '0'
          - '5'
          - '10'
          - '20'

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape articles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python crawler.py \
            --max-pages ${{ inputs.max_pages }} \
            --max-depth ${{ inputs.max_depth }} \
            --delay 0.5

      - name: Chain next run if needed
        if: failure() == false && env.pending != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PENDING: ${{ env.pending }}
        run: |
          if [ "${{ inputs.runs_left }}" -gt "0" ]; then
            gh workflow run scrape.yml \
              -f max_pages=${{ inputs.max_pages }} \
              -f max_depth=${{ inputs.max_depth }} \
              -f runs_left=$((${{ inputs.runs_left }} - 1))
            echo "Chained next run with $((${{ inputs.runs_left }} - 1)) runs left"
          fi
