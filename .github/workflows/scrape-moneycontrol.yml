name: Scrape Moneycontrol (Recursive)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Pages per run'
        required: false
        default: '50'
        type: choice
        options:
          - '10'
          - '25'
          - '50'
          - '100'
          - '200'
      max_depth:
        description: 'Maximum link depth'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      calls_left:
        description: 'Recursion depth (how many times to cycle)'
        required: false
        default: '5'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'

jobs:
  scrape_moneycontrol:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Moneycontrol articles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python crawler.py \
            --max-pages ${{ inputs.max_pages }} \
            --max-depth ${{ inputs.max_depth }} \
            --delay 0.5

      - name: Check if should call Livemint
        if: inputs.calls_left != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLS_LEFT: ${{ inputs.calls_left }}
        run: |
          echo "Triggering Livemint workflow (calls_left: ${{ inputs.calls_left }})"
          gh workflow run scrape-livemint.yml \
            --repo ${{ github.repository }} \
            -f max_pages=${{ inputs.max_pages }} \
            -f max_depth=${{ inputs.max_depth }} \
            -f calls_left=$((${{ inputs.calls_left }} - 1))
